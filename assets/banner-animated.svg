<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">Victor Vinny Braz — Analista de Dados e BI</title>
<desc id="desc">Dados que viram decisões. SQL, Power BI, Python e Machine Learning. Banner animado em azul-escuro, com gráfico que se desenha, pontos luminosos e detalhes em movimento suave. Respeita a preferência por movimento reduzido.</desc>
<style>
  .tech-label { fill: #bac9dc; animation: tech-text 12s linear infinite; }
  .tech-chip { opacity: .04; animation: tech-chip 12s linear infinite; }
  .tech-two { animation-delay: -9s; }
  .tech-three { animation-delay: -6s; }
  .tech-four { animation-delay: -3s; }
  @keyframes tech-text { 0%, 20% { fill: #a4fff0; } 25%, 95% { fill: #bac9dc; } 100% { fill: #a4fff0; } }
  @keyframes tech-chip { 0%, 20% { opacity: .95; } 25%, 95% { opacity: .04; } 100% { opacity: .95; } }
  .chart-line { animation: draw-line 8s ease-in-out infinite; }
  .chart-tracer { animation: trace-line 6s linear infinite; }
  .chart-area { animation: breathe-area 8s ease-in-out infinite; }
  .end-pulse { transform-box: fill-box; transform-origin: center; animation: pulse-ring 3.4s ease-out infinite; }
  .status-pulse { animation: status-glow 4s ease-in-out infinite; }
  .ambient-glow { animation: ambient-breathe 9s ease-in-out infinite alternate; }
  .light-sweep { animation: sweep 10s ease-in-out infinite; }
  .data-particle { animation: float-data 9s ease-in-out infinite; }
  .particle-two { animation-delay: -3s; }
  .particle-three { animation-delay: -6s; }
  .flow-step { animation: flow-highlight 6s ease-in-out infinite; }
  .step-two { animation-delay: -4s; }
  .step-three { animation-delay: -2s; }
  @keyframes draw-line {
    0%, 8% { stroke-dashoffset: 100; opacity: .6; }
    48%, 88% { stroke-dashoffset: 0; opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: .2; }
  }
  @keyframes trace-line {
    0% { stroke-dashoffset: 110; opacity: 0; }
    8%, 75% { opacity: .95; }
    90%, 100% { stroke-dashoffset: -10; opacity: 0; }
  }
  @keyframes breathe-area { 0%, 100% { opacity: .035; } 45%, 85% { opacity: .13; } }
  @keyframes pulse-ring { 0% { transform: scale(.8); opacity: .75; } 85%, 100% { transform: scale(2.7); opacity: 0; } }
  @keyframes status-glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes ambient-breathe { from { opacity: .55; } to { opacity: 1; } }
  @keyframes sweep { 0%, 8% { transform: translateX(0); opacity: 0; } 18%, 78% { opacity: .9; } 92%, 100% { transform: translateX(1010px); opacity: 0; } }
  @keyframes float-data { 0%, 100% { transform: translateY(0); opacity: .18; } 50% { transform: translateY(-12px); opacity: .7; } }
  @keyframes flow-highlight { 0%, 30%, 100% { fill: #91a7be; } 10%, 22% { fill: #a0fff0; } }
  @media (prefers-reduced-motion: reduce) {
    .chart-line, .chart-tracer, .chart-area, .end-pulse, .status-pulse,
    .ambient-glow, .light-sweep, .data-particle, .flow-step, .tech-label, .tech-chip { animation: none !important; }
    .chart-line { stroke-dashoffset: 0; opacity: 1; }
    .chart-tracer, .end-pulse, .light-sweep { opacity: 0; }
  }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1a2c"/><stop offset="1" stop-color="#070e1a"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#63e6da"/><stop offset="1" stop-color="#66a6ff"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#1b7d8f" stop-opacity=".22"/><stop offset="1" stop-color="#122234" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#708baa" opacity=".13"/></pattern>
</defs>
<rect width="1280" height="400" rx="22" fill="url(#bg)"/>
<rect width="1280" height="400" rx="22" fill="url(#dots)"/>
<ellipse class="ambient-glow" cx="1060" cy="220" rx="370" ry="300" fill="url(#glow)"/>
<rect x="1" y="1" width="1278" height="398" rx="21" fill="none" stroke="#26364b"/>
<rect x="50" y="48" width="270" height="32" rx="16" fill="#102d36" stroke="#25575e"/>
<circle class="status-pulse" cx="69" cy="64" r="4" fill="#66e4d5"/>
<text x="84" y="69" fill="#8aeade" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.7">ANALISTA DE DADOS &amp; BI</text>
<text x="50" y="155" fill="#f2f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="55" font-weight="700" letter-spacing="-1.8">Victor Vinny Braz</text>
<text x="51" y="211" fill="#d2dfef" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Dados que viram decisões.</text>
<text x="52" y="253" fill="#92a5bd" font-family="Segoe UI,Arial,sans-serif" font-size="17">Análise · Business Intelligence · Automação · Machine Learning</text>
<path d="M52 295H679" stroke="#26394e"/>
<g fill="#14373d" stroke="#55d9c8" stroke-width="1">
  <rect class="tech-chip" x="42" y="312" width="49" height="32" rx="8"/>
  <rect class="tech-chip tech-two" x="113" y="312" width="92" height="32" rx="8"/>
  <rect class="tech-chip tech-three" x="237" y="312" width="79" height="32" rx="8"/>
  <rect class="tech-chip tech-four" x="349" y="312" width="189" height="32" rx="8"/>
</g>
<text class="tech-label" x="52" y="333" fill="#bac9dc" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">SQL</text>
<circle cx="101" cy="328" r="2" fill="#50677d"/>
<text class="tech-label tech-two" x="123" y="333" fill="#bac9dc" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">POWER BI</text>
<circle cx="225" cy="328" r="2" fill="#50677d"/>
<text class="tech-label tech-three" x="247" y="333" fill="#bac9dc" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">PYTHON</text>
<circle cx="337" cy="328" r="2" fill="#50677d"/>
<text class="tech-label tech-four" x="359" y="333" fill="#bac9dc" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">MACHINE LEARNING</text>
<g transform="translate(812 43)">
  <text x="350" y="18" text-anchor="end" fill="#7c94ae" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2.5">PORTFÓLIO DE PROJETOS</text>
  <rect x="0" y="50" width="356" height="246" rx="18" fill="#0d1b2b" stroke="#2b435c"/>
  <circle class="status-pulse" cx="20" cy="71" r="3" fill="#68ddd3"/><circle cx="32" cy="71" r="3" fill="#4c6c87"/><circle cx="44" cy="71" r="3" fill="#344c65"/>
  <text x="334" y="76" text-anchor="end" fill="#829cb6" font-family="Consolas,monospace" font-size="10" letter-spacing="1">DATA / INSIGHTS</text>
  <path d="M22 88H334" stroke="#22374e"/>
  <g fill="none" stroke="#1d3349"><path d="M28 130H328M28 164H328M28 198H328M28 232H328"/><path d="M68 110V251M132 110V251M196 110V251M260 110V251"/></g>
  <path class="chart-area" d="M30 223L75 201L123 210L170 160L218 176L265 131L326 115L326 251H30Z" fill="#46d9ce" opacity=".07"/>
  <path d="M30 223L75 201L123 210L170 160L218 176L265 131L326 115" fill="none" stroke="#2c6476" stroke-width="2" opacity=".55"/>
  <path class="chart-line" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" d="M30 223L75 201L123 210L170 160L218 176L265 131L326 115" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="chart-tracer" pathLength="100" stroke-dasharray="5 105" d="M30 223L75 201L123 210L170 160L218 176L265 131L326 115" fill="none" stroke="#c5fff5" stroke-width="4" stroke-linecap="round" opacity="0"/>
  <circle class="end-pulse" cx="326" cy="115" r="7" fill="none" stroke="#7ef2dd" stroke-width="1" opacity="0"/>
  <g fill="#0e1d2d" stroke="#78ded9" stroke-width="2"><circle cx="75" cy="201" r="4"/><circle cx="123" cy="210" r="4"/><circle cx="170" cy="160" r="4"/><circle cx="218" cy="176" r="4"/><circle cx="265" cy="131" r="4"/><circle cx="326" cy="115" r="5"/></g>
  <text class="flow-step" x="25" y="276" fill="#91a7be" font-family="Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="1.2">EXPLORAR</text>
  <path d="M107 273H132m-4-3 4 3-4 3" fill="none" stroke="#43617b"/>
  <text class="flow-step step-two" x="147" y="276" fill="#91a7be" font-family="Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="1.2">MODELAR</text>
  <path d="M220 273H245m-4-3 4 3-4 3" fill="none" stroke="#43617b"/>
  <text class="flow-step step-three" x="260" y="276" fill="#8be5dc" font-family="Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="1.2">COMUNICAR</text>
</g>
<rect x="51" y="382" width="1128" height="2" rx="1" fill="url(#accent)" opacity=".55"/>
<rect class="light-sweep" x="51" y="381" width="110" height="3" rx="1.5" fill="#adfff2" opacity="0"/>
<g fill="#6ddfda">
  <circle class="data-particle" cx="753" cy="105" r="2" opacity=".18"/>
  <circle class="data-particle particle-two" cx="1207" cy="185" r="2" opacity=".18"/>
  <circle class="data-particle particle-three" cx="766" cy="316" r="2.5" opacity=".18"/>
</g>
</svg>